services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE is required}
    ports: !override
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - /opt/sub2api-custom/sync-trigger.sh:/app/scripts/sync-upstream.sh:ro
    environment:
      RISK_CONTROL_URL: ${RISK_CONTROL_URL:-http://extensions-self:8090}
      RISK_CONTROL_INTERNAL_SECRET: ${RISK_CONTROL_INTERNAL_SECRET:?RISK_CONTROL_INTERNAL_SECRET is required}
      RISK_CONTROL_DECISION_FAIL_MODE: ${RISK_CONTROL_DECISION_FAIL_MODE:-open}
      RISK_IDENTITY_V2_ENABLED: ${RISK_IDENTITY_V2_ENABLED:-false}
      RISK_IDENTITY_IP_COLLECTION_ENABLED: ${RISK_IDENTITY_IP_COLLECTION_ENABLED:-false}
      RISK_IDENTITY_DEVICE_COLLECTION_ENABLED: ${RISK_IDENTITY_DEVICE_COLLECTION_ENABLED:-false}
      RISK_DEVICE_COOKIE_SIGNING_KEY: ${RISK_DEVICE_COOKIE_SIGNING_KEY:-}
      RISK_DEVICE_COOKIE_SIGNING_KEY_ID: ${RISK_DEVICE_COOKIE_SIGNING_KEY_ID:-}
      RISK_DEVICE_COOKIE_SIGNING_PREVIOUS_KEY: ${RISK_DEVICE_COOKIE_SIGNING_PREVIOUS_KEY:-}
      RISK_DEVICE_COOKIE_SIGNING_PREVIOUS_KEY_ID: ${RISK_DEVICE_COOKIE_SIGNING_PREVIOUS_KEY_ID:-}
      RISK_IDENTITY_TRUST_CLOUDFLARE_HEADERS: ${RISK_IDENTITY_TRUST_CLOUDFLARE_HEADERS:-false}

  risk-control-postgres:
    image: postgres:18-alpine
    container_name: risk-control-postgres
    restart: unless-stopped
    volumes:
      - risk_control_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${RISK_CONTROL_POSTGRES_USER:-risk_control_app}
      POSTGRES_PASSWORD: ${RISK_CONTROL_POSTGRES_PASSWORD:?RISK_CONTROL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${RISK_CONTROL_POSTGRES_DB:-risk_control}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RISK_CONTROL_POSTGRES_USER:-risk_control_app} -d ${RISK_CONTROL_POSTGRES_DB:-risk_control}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  extensions-self:
    image: ${EXTENSIONS_SELF_IMAGE:?EXTENSIONS_SELF_IMAGE is required}
    container_name: extensions-self
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: "0.50"
    expose:
      - "8090"
    environment:
      RISK_CONTROL_LISTEN: :8090
      RISK_CONTROL_MODE: ${RISK_CONTROL_MODE:-shadow}
      RISK_CONTROL_INTERNAL_SECRET: ${RISK_CONTROL_INTERNAL_SECRET:?RISK_CONTROL_INTERNAL_SECRET is required}
      RISK_CONTROL_DATABASE_URL: postgres://${RISK_CONTROL_POSTGRES_USER:-risk_control_app}:${RISK_CONTROL_POSTGRES_PASSWORD:?RISK_CONTROL_POSTGRES_PASSWORD is required}@risk-control-postgres:5432/${RISK_CONTROL_POSTGRES_DB:-risk_control}?sslmode=disable
      RISK_IDENTITY_V2_ENABLED: ${RISK_IDENTITY_V2_ENABLED:-false}
      RISK_IDENTITY_IP_COLLECTION_ENABLED: ${RISK_IDENTITY_IP_COLLECTION_ENABLED:-false}
      RISK_IDENTITY_DEVICE_COLLECTION_ENABLED: ${RISK_IDENTITY_DEVICE_COLLECTION_ENABLED:-false}
      RISK_IDENTITY_ADMIN_ENABLED: ${RISK_IDENTITY_ADMIN_ENABLED:-false}
      RISK_IDENTITY_RULES_ENABLED: ${RISK_IDENTITY_RULES_ENABLED:-false}
      RISK_IDENTITY_IP_RULES_ENABLED: ${RISK_IDENTITY_IP_RULES_ENABLED:-false}
      RISK_IDENTITY_DEVICE_RULES_ENABLED: ${RISK_IDENTITY_DEVICE_RULES_ENABLED:-false}
      RISK_IDENTITY_COMPOSITE_RULES_ENABLED: ${RISK_IDENTITY_COMPOSITE_RULES_ENABLED:-false}
      RISK_IDENTITY_HMAC_KEY: ${RISK_IDENTITY_HMAC_KEY:-}
      RISK_IDENTITY_ENCRYPTION_KEY: ${RISK_IDENTITY_ENCRYPTION_KEY:-}
      RISK_IDENTITY_ENCRYPTION_KEY_ID: ${RISK_IDENTITY_ENCRYPTION_KEY_ID:-}
      RISK_IDENTITY_PREVIOUS_ENCRYPTION_KEY: ${RISK_IDENTITY_PREVIOUS_ENCRYPTION_KEY:-}
      RISK_IDENTITY_PREVIOUS_ENCRYPTION_KEY_ID: ${RISK_IDENTITY_PREVIOUS_ENCRYPTION_KEY_ID:-}
      RISK_IDENTITY_SHADOW_UNTIL: ${RISK_IDENTITY_SHADOW_UNTIL:-}
      RISK_IDENTITY_GEO_SOURCE: ${RISK_IDENTITY_GEO_SOURCE:-cloudflare_or_local}
      RISK_IDENTITY_QUALITY_MIN_EVENTS: ${RISK_IDENTITY_QUALITY_MIN_EVENTS:-50}
      RISK_IDENTITY_QUALITY_MIN_COVERAGE_PERCENT: ${RISK_IDENTITY_QUALITY_MIN_COVERAGE_PERCENT:-80}
      RISK_IDENTITY_QUALITY_MIN_USERS: ${RISK_IDENTITY_QUALITY_MIN_USERS:-50}
      RISK_IDENTITY_QUALITY_MAX_IP_SHARE_PERCENT: ${RISK_IDENTITY_QUALITY_MAX_IP_SHARE_PERCENT:-20}
      EXTENSIONS_SELF_HOMEPAGE_DIR: /app/homepage
      ACCOUNT_MONITOR_ENABLED: ${ACCOUNT_MONITOR_ENABLED:-false}
      ACCOUNT_MONITOR_SOURCE_DATABASE_URL: ${ACCOUNT_MONITOR_SOURCE_DATABASE_URL:-}
      ACCOUNT_MONITOR_POLL_SECONDS: ${ACCOUNT_MONITOR_POLL_SECONDS:-60}
      ACCOUNT_MONITOR_LOOKBACK_SECONDS: ${ACCOUNT_MONITOR_LOOKBACK_SECONDS:-300}
      ACCOUNT_MONITOR_BATCH_SIZE: ${ACCOUNT_MONITOR_BATCH_SIZE:-1000}
      ACCOUNT_MONITOR_QUERY_TIMEOUT_MS: ${ACCOUNT_MONITOR_QUERY_TIMEOUT_MS:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      risk-control-postgres:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  risk_control_postgres_data:
    driver: local
