services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE is required}
    volumes:
      - /root/sub2api:/repo:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/sub2api-custom/sync-trigger.sh:/app/scripts/sync-upstream.sh:ro
      - /usr/bin/docker:/usr/bin/docker:ro
    environment:
      RISK_CONTROL_URL: ${RISK_CONTROL_URL:-http://extensions-self:8090}
      RISK_CONTROL_INTERNAL_SECRET: ${RISK_CONTROL_INTERNAL_SECRET:?RISK_CONTROL_INTERNAL_SECRET is required}
      RISK_CONTROL_DECISION_FAIL_MODE: ${RISK_CONTROL_DECISION_FAIL_MODE:-open}

  risk-control-postgres:
    image: postgres:18-alpine
    container_name: risk-control-postgres
    restart: unless-stopped
    volumes:
      - risk_control_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${RISK_CONTROL_POSTGRES_USER:-risk_control_app}
      POSTGRES_PASSWORD: ${RISK_CONTROL_POSTGRES_PASSWORD:?RISK_CONTROL_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${RISK_CONTROL_POSTGRES_DB:-risk_control}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RISK_CONTROL_POSTGRES_USER:-risk_control_app} -d ${RISK_CONTROL_POSTGRES_DB:-risk_control}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  extensions-self:
    image: ${EXTENSIONS_SELF_IMAGE:?EXTENSIONS_SELF_IMAGE is required}
    container_name: extensions-self
    restart: unless-stopped
    init: true
    mem_limit: 256m
    cpus: "0.50"
    expose:
      - "8090"
    environment:
      RISK_CONTROL_LISTEN: :8090
      RISK_CONTROL_MODE: ${RISK_CONTROL_MODE:-shadow}
      RISK_CONTROL_INTERNAL_SECRET: ${RISK_CONTROL_INTERNAL_SECRET:?RISK_CONTROL_INTERNAL_SECRET is required}
      RISK_CONTROL_DATABASE_URL: postgres://${RISK_CONTROL_POSTGRES_USER:-risk_control_app}:${RISK_CONTROL_POSTGRES_PASSWORD:?RISK_CONTROL_POSTGRES_PASSWORD is required}@risk-control-postgres:5432/${RISK_CONTROL_POSTGRES_DB:-risk_control}?sslmode=disable
      EXTENSIONS_SELF_HOMEPAGE_DIR: /app/homepage
      ACCOUNT_MONITOR_ENABLED: ${ACCOUNT_MONITOR_ENABLED:-false}
      ACCOUNT_MONITOR_SOURCE_DATABASE_URL: ${ACCOUNT_MONITOR_SOURCE_DATABASE_URL:-}
      ACCOUNT_MONITOR_POLL_SECONDS: ${ACCOUNT_MONITOR_POLL_SECONDS:-60}
      ACCOUNT_MONITOR_LOOKBACK_SECONDS: ${ACCOUNT_MONITOR_LOOKBACK_SECONDS:-300}
      ACCOUNT_MONITOR_BATCH_SIZE: ${ACCOUNT_MONITOR_BATCH_SIZE:-1000}
      ACCOUNT_MONITOR_QUERY_TIMEOUT_MS: ${ACCOUNT_MONITOR_QUERY_TIMEOUT_MS:-3000}
    depends_on:
      postgres:
        condition: service_healthy
      risk-control-postgres:
        condition: service_healthy
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8090/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  risk_control_postgres_data:
    driver: local
