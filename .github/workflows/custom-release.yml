name: Custom Release

on:
  push:
    branches:
      - custom-release
      - 'integration/release-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: go version | grep -q 'go1.26.5'
      - name: Backend unit tests
        working-directory: backend
        run: make test-unit
      - name: Backend integration tests
        working-directory: backend
        run: make test-integration

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend Vitest
        working-directory: frontend
        run: pnpm run test:run
      - name: Frontend production build
        working-directory: frontend
        run: pnpm run build

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: extensions-self/risk-control/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: |
            extensions-self/account-monitor/go.sum
            extensions-self/risk-control/go.sum
      - name: Account monitor tests
        working-directory: extensions-self/account-monitor
        run: go test ./...
      - name: Risk control tests
        working-directory: extensions-self/risk-control
        run: go test ./...

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Deployment contracts
        run: node --test deploy/tests/*.test.mjs
      - name: Operations contracts
        shell: pwsh
        run: ./deploy/ops/tests/test-script-contract.ps1
      - name: Stable Release resolver tests
        run: bash deploy/ops/tests/test-release-resolver.sh
      - name: Shell syntax
        run: find deploy/ops -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: release
        name: Read stable Release version
        run: |
          tag="$(jq -er '.tag' deploy/stable-release-baseline.json)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  images:
    needs: [backend, golangci, frontend, extensions, deployment, metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/listencodes/sub2api-custom:custom-${{ github.sha }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            IMAGE_VERSION=${{ needs.metadata.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
      - name: Build and push extensions image
        uses: docker/build-push-action@v6
        with:
          context: extensions-self
          file: extensions-self/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/listencodes/sub2api-extensions:custom-${{ github.sha }}
          build-args: |
            IMAGE_VERSION=${{ needs.metadata.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
